name: Post Headlines to Telegram (예약 꺼짐)

# 2026-11 엄선 뉴스(post_news.yml)로 대체되어 자동 실행을 껐어요.
# 다시 켜려면 아래 schedule 두 줄의 주석(#)을 지우면 돼요.
on:
  # schedule:
  #   - cron: "0 23 * * *"   # KST 08:00
  #   - cron: "0 11 * * *"   # KST 20:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post-headlines:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install -r requirements-headlines.txt

      - name: 한 줄 뉴스 게시 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python headlines_bot.py

      - name: 게시 기록(headline_log.json) 저장
        run: |
          git config user.name "coin-news-bot"
          git config user.email "actions@github.com"
          git add headline_log.json
          git diff --quiet --cached || git commit -m "update headline log"
          git push
