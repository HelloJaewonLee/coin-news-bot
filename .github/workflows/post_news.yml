name: Post Curated News to Telegram

on:
  # Claude 예약 작업이 queue/에 글을 넣으면 바로 실행
  push:
    branches: [main]
    paths: ["queue/*.json"]
  # 혹시 놓친 글이 있으면 매시간 40분에 한 번 더 확인 (KST 08:40 ~ 23:40)
  schedule:
    - cron: "40 23 * * *"
    - cron: "40 0-14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-repo-write
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install -r requirements-news.txt

      - name: 대기 중인 글 게시
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python post_queue.py

      - name: 게시 기록 저장
        if: always()
        run: |
          git config user.name "coin-news-bot"
          git config user.email "actions@github.com"
          git add -A queue news_log.json 2>/dev/null || git add -A queue
          git diff --quiet --cached && exit 0
          git commit -m "post news from queue"
          git pull --rebase origin main
          git push
